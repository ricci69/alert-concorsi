name: Run Scraper Daily

on:
  schedule:
    - cron: '15 15 * * *'  # 15:15 Europe/Rome (UTC+1/+2)
  workflow_dispatch:  # allow manual trigger

jobs:
  scraper:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome  # ensure cron runs in Rome timezone
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
          python scraper.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          [ -f concorsi_visti.json ] && git add concorsi_visti.json
          [ -f failures_counter.json ] && git add failures_counter.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Update concorsi visti and failure counter [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
